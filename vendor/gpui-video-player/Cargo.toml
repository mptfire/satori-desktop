# Vendored from gpui-video-player 0.1.3 (crates.io, registry-normalized
# manifest). The one change is in src/video.rs — see D69 in the root
# Cargo.toml's [patch.crates-io] note.
[package]
edition = "2024"
name = "gpui-video-player"
version = "0.1.3"
authors = ["nemurubaka <cijiugechu@gmail.com>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A video player library for gpui applications, built on top of GStreamer."
license = "MIT"
repository = "https://github.com/cijiugechu/gpui-video-player"

[features]
default = ["gpui"]
gpui = [
    "dep:gpui",
    "dep:core-video",
]
gpui-pre = [
    "dep:gpui_pre",
    "dep:core-video-pre",
    "dep:objc2-core-foundation",
    "dep:objc2-core-video",
]

[lib]
name = "gpui_video_player"
path = "src/lib.rs"

[dependencies.glib]
version = "0.22"

[dependencies.gpui]
version = "0.2"
optional = true

[dependencies.gpui_pre]
version = "=0.3.9"
optional = true
default-features = false
package = "gpui-pre"

[dependencies.gstreamer]
version = "0.25"

[dependencies.gstreamer-app]
version = "0.25"

[dependencies.gstreamer-base]
version = "0.25"

[dependencies.gstreamer-video]
version = "0.25"

[dependencies.image]
version = "0.25"
features = [
    "png",
    "gif",
    "webp",
]
default-features = false

[dependencies.log]
version = "0.4"

[dependencies.parking_lot]
version = "0.13"

[dependencies.smallvec]
version = "1"

[dependencies.thiserror]
version = "2"

[dependencies.url]
version = "2"

[dependencies.yuv]
version = "0.8"

[target.'cfg(target_os = "macos")'.dependencies.core-foundation]
version = "0.10"

[target.'cfg(target_os = "macos")'.dependencies.core-video]
version = "0.4"
optional = true

[target.'cfg(target_os = "macos")'.dependencies.core-video-pre]
version = "0.6"
optional = true
package = "core-video"

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-foundation]
version = "0.3.2"
optional = true

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-video]
version = "0.3.2"
optional = true
